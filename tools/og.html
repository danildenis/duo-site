<!doctype html>
<!-- Обложка для ссылок (img/og.jpg, 1200×630): открыть на 1200×630 и снять снимок экрана -->
<html lang="ru"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#000}
.card{position:absolute;inset:14px;border-radius:32px;overflow:hidden;background:#0B0C0E;color:#F2F3F5;font-family:Manrope,sans-serif}
.a,.b{position:absolute;border-radius:50%}
.a{width:900px;height:900px;right:-300px;top:-520px;background:radial-gradient(circle,rgba(70,120,255,.55) 0%,rgba(62,128,240,.36) 18%,rgba(48,140,210,.18) 38%,transparent 66%)}
.b{width:700px;height:700px;left:-260px;bottom:-460px;background:radial-gradient(circle,rgba(40,150,190,.4) 0%,rgba(48,140,210,.18) 30%,transparent 66%)}
.lines{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 1px,transparent 1px 22px,rgba(0,0,0,.18) 22px 23px,transparent 23px 46px);-webkit-mask-image:radial-gradient(ellipse 70% 70% at 80% 10%,#000 20%,transparent 70%)}
.in{position:absolute;inset:64px 72px;display:flex;flex-direction:column}
.logo{width:150px;height:78px;background:url(../img/logo-white.svg) left center/contain no-repeat}
h1{margin:auto 0 0;font-weight:300;font-size:76px;line-height:1;letter-spacing:-.04em}
h1 em{display:block;font-style:normal;color:rgba(242,243,245,.5)}
.foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:34px;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:rgba(242,243,245,.55)}
.foot b{font-weight:400;font-size:28px;letter-spacing:-.02em;text-transform:none;color:#F2F3F5}
</style></head>
<body><div class="card"><i class="a"></i><i class="b"></i><div class="lines"></div>
<div class="in"><div class="logo"></div>
<h1>Сайты и Telegram-боты <em>под ключ</em></h1>
<div class="foot"><span>Websites · Products · Automation</span><b>сайт от 10 000 ₽</b></div></div></div></body></html>
